name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/wrapper-validation-action@v3

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Rust toolchain (for ECH library)
        uses: dtolnay/rust-toolchain@stable
        with:
          # Intel runner 交叉编译到 Apple Silicon 必需；arm64 runner 上也是幂等操作
          targets: aarch64-apple-darwin

      # 重编并同步 prebuilt（与提交版本不一致时测试即失败），再跑测试
      - name: Build & sync Rust ECH library
        run: ./gradlew updateEchPrebuilt

      - name: Compile & Test
        run: ./gradlew test --stacktrace
