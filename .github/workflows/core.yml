name: Core

on:
  push:
    branches: [rust-flutter]
    paths:
      - 'rust/core/**'
      - '.github/workflows/core.yml'
  pull_request:
    paths:
      - 'rust/core/**'
      - '.github/workflows/core.yml'
  workflow_dispatch:

jobs:
  core:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/core

      - name: Build core
        working-directory: rust/core
        run: cargo build --release --locked

      # 端到端验证核心能力：不发送 SNI 的 TLS 能否取回真实图片。
      # 失败时以非零码退出，同时把图片写盘供上传。
      # pipefail 不能省：没有它，管道会把 cargo 的非零退出码换成 tee 的 0，
      # 验证失败也会显示通过。
      - name: Fetch a real image without SNI
        working-directory: rust/core
        run: |
          set -o pipefail
          cargo run --release --locked --bin fetch_probe 2>&1 | tee probe-output.txt

      # 验证 PKCE 与接口签名头。签名正确时缺少凭据应得到 401，
      # 签名有问题会得到别的错误，两者可区分。
      # 这一步在不受干扰的网络上跑，国内网络下 app-api 需要走 QUIC（后续阶段接入）。
      - name: Verify PKCE and API signature headers
        working-directory: rust/core
        run: |
          set -o pipefail
          cargo run --release --locked --bin api_probe 2>&1 | tee api-probe-output.txt

      # 验证登录凭据与下载队列跨进程保留。脚本里每个调用都带超时，
      # 避免钥匙串访问在无人应答的会话里一直阻塞。
      - name: Verify credentials and download queue survive a restart
        working-directory: rust/core
        run: |
          set -o pipefail
          verify/store-persistence.sh 2>&1 | tee store-probe-output.txt

      - name: Upload verification output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-probe-output
          path: |
            rust/core/probe-output.txt
            rust/core/api-probe-output.txt
            rust/core/store-probe-output.txt
            rust/core/fetched-image.bin
          if-no-files-found: warn
