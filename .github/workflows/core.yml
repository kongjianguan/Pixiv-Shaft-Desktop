name: Core

# 验证步骤本身在 core-check.yml 里，这里只负责什么时候跑。

on:
  push:
    branches: [rust-flutter]
    paths:
      - 'rust/core/**'
      - '.github/workflows/core.yml'
      - '.github/workflows/core-check.yml'
  pull_request:
    paths:
      - 'rust/core/**'
      - '.github/workflows/core.yml'
      - '.github/workflows/core-check.yml'
  workflow_dispatch:

jobs:
  core:
    uses: ./.github/workflows/core-check.yml
