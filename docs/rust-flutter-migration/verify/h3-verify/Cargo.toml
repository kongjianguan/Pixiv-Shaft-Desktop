[package]
name = "h3-verify"
version = "0.1.0"
edition = "2021"

[dependencies]
quinn = "0.11"
h3 = "0.0.8"
h3-quinn = "0.0.10"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1"
tokio = { version = "1", features = ["full"] }
webpki-root-certs = "1.0"
bytes = "1"
http = "1"
url = "2"
