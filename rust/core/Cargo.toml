[package]
name = "pixiv_core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib", "lib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
rustls = { version = "0.23", default-features = false, features = ["ring", "aws_lc_rs", "std", "tls12"] }
webpki-root-certs = "1.0"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "charset", "gzip", "form", "query", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
base64 = "0.22"
chrono = "0.4"
md-5 = "0.10"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
bytes = "1"
h3 = "0.0.8"
h3-quinn = "0.0.10"
http = "1"
quinn = "0.11"
rusqlite = { version = "0.32", features = ["bundled"] }
security-framework = "3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[profile.release]
opt-level = 3
